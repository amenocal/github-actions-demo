---
name: Update Issue Comment

# When someone comments on an issue, this workflow edits THAT comment in place,
# appending a footer so you can tell an edited comment from an untouched one.
#
# Recursion safety (3 independent layers):
# 1. Only `created` is listened to, never `edited`. Our own edit fires an
#    `edited` event, which this workflow ignores.
# 2. The edit is made with the default GITHUB_TOKEN. Events produced by that
#    token do not start new workflow runs, so neither this workflow nor other
#    issue_comment listeners (for example giphy-generator.yml) are re-triggered.
# 3. Bot authors are skipped, and a marker check makes the edit idempotent, so
#    an already-processed comment is never edited again.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: update-issue-comment-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  edit-comment:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '<!-- edited-by-workflow -->')
    runs-on: ubuntu-latest
    steps:
      - name: Edit the comment that triggered this run
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- edited-by-workflow -->';
            const comment = context.payload.comment;
            const { owner, repo } = context.repo;

            if (comment.body.includes(marker)) {
              core.notice('Comment already edited by this workflow, skipping.');
              return;
            }

            const footer = [
              '',
              '---',
              marker,
              `_✏️ Edited by [\`${context.workflow}\`](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              `at ${new Date().toISOString()} (run #${context.runNumber})._`,
            ].join('\n');

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: comment.id,
              body: comment.body + footer,
            });

            core.notice(`Edited comment ${comment.id} by @${comment.user.login}`);
